name: Feature request
description: Suggest a change or addition.
title: "[FEATURE] <short description>"
labels: ["⭐ goal: addition", "🚦 status: awaiting triage"]
body:
  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicate check
      description: Search open and closed issues first.
      options:
        - label: I checked open and closed issues and this is not a duplicate
          required: true
  - type: textarea
    id: outcome
    attributes:
      label: What outcome do you want?
      description: What should be possible or easier when this exists? Examples and links to similar work are helpful.
    validations:
      required: true
