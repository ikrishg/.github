name: Bug
description: Something is broken or behaves wrong.
title: "[BUG] <short description>"
labels: ["bug"]
body:
  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicate check
      description: Search open and closed issues first.
      options:
        - label: I checked open and closed issues and this is not a duplicate
          required: true
  - type: input
    attributes:
      label: Where did you see this?
      description: Repo name, URL, version, or environment (browser, OS, etc.).
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What happened vs what you expected?
      description: Describe the observable outcome. Attach links to screenshots or recordings if you have them.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Numbered steps, or what you were doing when it failed if you are not sure of exact steps.
    validations:
      required: true
